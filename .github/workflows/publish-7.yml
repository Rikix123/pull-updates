name: Publish Pull Browser 7.0.0
on:
  push:
    branches: [release/publish-7.0.0]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Assemble and verify exact signed archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v6.5.0 --pattern Pull-Browser-6.5.0-win-x64.zip --repo Rikix123/pull-updates
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python release/7.0.0/assemble.py Pull-Browser-6.5.0-win-x64.zip Pull-Browser-7.0.0-win-x64.zip
      - name: Stage both assets, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v7.0.0 Pull-Browser-7.0.0-win-x64.zip release/7.0.0/update.json --draft --repo Rikix123/pull-updates --target $env:GITHUB_SHA --title "Pull Browser 7.0.0" --notes-file release/7.0.0/RELEASE_NOTES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release = gh release view v7.0.0 --repo Rikix123/pull-updates --json assets,isDraft | ConvertFrom-Json
          $zip = $release.assets | Where-Object name -eq 'Pull-Browser-7.0.0-win-x64.zip'
          $manifest = $release.assets | Where-Object name -eq 'update.json'
          $digest = 'sha256:' + (Get-FileHash release/7.0.0/update.json).Hash.ToLowerInvariant()
          if (!$release.isDraft -or $zip.digest -ne 'sha256:a1c84ab1d8b866fc89f32e3dc719a5a8f8d689900b8cb4dfc3e36df45ff28919' -or $manifest.digest -ne $digest) { throw 'Draft asset verification failed.' }
          gh release edit v7.0.0 --repo Rikix123/pull-updates --draft=false --latest
